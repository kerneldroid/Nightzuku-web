name: Deploy to kerneldroid.github.io

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightzuku-web-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to Pages repository
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${PAGES_DEPLOY_KEY}" ]; then
            echo "::error::PAGES_DEPLOY_KEY secret is not set"
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "${PAGES_DEPLOY_KEY}" > ~/.ssh/pages_deploy_key
          chmod 600 ~/.ssh/pages_deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          export GIT_SSH_COMMAND="ssh -i ~/.ssh/pages_deploy_key -o IdentitiesOnly=yes"

          git clone --depth 1 git@github.com:kerneldroid/kerneldroid.github.io.git pages
          mkdir -p pages/nightzuku
          cp dist/index.html pages/nightzuku/index.html

          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nightzuku/index.html

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "deploy: update nightzuku landing page"
          git push origin main
